[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saltup"
version = "0.9.12"
description = "add flavor to your AI projects"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    { name = "Marco Garzola" },
    { name = "Francesco Sonnessa" },
    { name = "Marc Randriatsimiovalaza" }
]
keywords = ["AI", "deep learning", "computer vision", "YOLO"]
license = { text = "MIT" }

# BASE DEPENDENCIES (LITE version - default)
# Only data processing, dataset loaders, utilities (~200MB)
dependencies = [
    # Data and image manipulation
    "pillow",
    "opencv-python",
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "fastparquet",
    "albumentations",
    
    # Cloud & Utilities
    "boto3",           # S3 access
    "requests",        # Range reads for MP4 edit-list patching
    "tqdm",            # Progress bars
    "toml",
    "dotmap",
    
    # Visualization
    "matplotlib",
    "seaborn",
]

# OPTIONAL DEPENDENCIES
#
# Pick only the inference backend(s) you need, e.g.:
#   pip install "saltup[onnx]"            # ONNX Runtime (CPU)
#   pip install "saltup[onnx-gpu]"        # ONNX Runtime with CUDA
#   pip install "saltup[keras-cpu]"       # Keras/TFLite models, tensorflow-cpu (lighter)
#   pip install "saltup[keras]"           # Keras/TFLite models, full tensorflow (GPU-capable)
#   pip install "saltup[torch]"           # PyTorch models (see CPU note below)
#   pip install "saltup[onnx,torch]"      # any mix of backends
#   pip install "saltup[inference]"       # every inference backend, CPU flavours
#   pip install "saltup[full]"            # everything: training, conversion, tracking
#
# PyTorch CPU-only: PyPI ships only the CUDA-enabled 'torch' wheel. The CPU wheel
# lives on the PyTorch index and package metadata cannot select an index, so add
# the flag yourself:
#   pip install "saltup[torch]" --extra-index-url https://download.pytorch.org/whl/cpu
[project.optional-dependencies]

# --- Inference backends (one per model format) ---
# .onnx models
onnx = [
    "onnxruntime",
    "onnx",
]
onnx-gpu = [
    "onnxruntime-gpu",
    "onnx",
]
# .keras / .h5 / .tflite models (Keras 3 needs a backend: TensorFlow here).
# 'keras' uses the regular tensorflow wheel (GPU-capable, larger);
# 'keras-cpu' uses tensorflow-cpu. Never install both in the same environment.
keras = [
    "tensorflow==2.18.0",
    "keras==3.12.0",
]
keras-cpu = [
    "tensorflow-cpu==2.18.0",
    "keras==3.12.0",
]
# .pt / .pth models. torchvision is included because many exported models
# pickle torchvision layers/ops. For CPU-only see the note above.
torch = [
    "torch",
    "torchvision",
]
# All inference backends together, CPU flavours (ONNX Runtime CPU, tensorflow-cpu)
inference = [
    "saltup[onnx,keras-cpu,torch]",
]

# --- Model conversion & quantization (Keras/Torch -> ONNX, ONNX quantization) ---
convert = [
    "saltup[onnx,keras,torch]",
    "tf2onnx==1.16.1",
    "onnx2torch",
]

# --- Training (data augmentation, experiment tracking, callbacks) ---
training = [
    "saltup[keras,torch]",
    "albumentations",
    "mlflow",
    "paho-mqtt",
]

# --- Audio processing ---
audio = [
    "librosa",
    "soundfile",
    "cmsisdsp",
]

# --- Development, notebooks & tests ---
dev = [
    "IPython",
    "ipykernel",
    "nbformat",
    "pytest",
    "moto[s3]",
]

# FULL version: everything above (~4GB total). Uses onnxruntime-gpu.
full = [
    "saltup[onnx-gpu,keras,torch,convert,training,audio,dev]",
    "torchaudio",
]

[project.scripts]
saltup_yolo_count_classes = "saltup.tools.yolo_count_classes:main"
saltup_collapse_labels = "saltup.tools.collapse_labels:main"
saltup_yolo_simlink_per_classes = "saltup.tools.yolo_simlink_per_classes:main"
saltup_yolo_image_inference = "saltup.tools.yolo_inference:main"
saltup_yolo_video_inference = "saltup.tools.yolo_video:main"
saltup_yolo_s3_inference = "saltup.tools.yolo_s3_inference:main"
saltup_info = "saltup.tools.saltup_info:main"
saltup_keras2onnx = "saltup.tools.keras2onnx:main"
saltup_onnx_quantization = "saltup.tools.onnx_quantization:main"

[tool.setuptools.packages.find]
include = ["saltup*"]
exclude = ["mlruns*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "network: tests that require an active internet connection (deselect with '-m not network')",
]
